# Extension-only app: no backend, no embedded admin UI.
# Everything ships as Functions + checkout UI extensions.

name = "stride-plus-suite"
client_id = "<set-by-shopify-cli-on-first-deploy>"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = false

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home/api/auth"]

[webhooks]
api_version = "2025-01"

[build]
include_config_on_deploy = true
